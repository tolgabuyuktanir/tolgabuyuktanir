<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Dr. Tolga Büyüktanır — R&amp;D Team Leader and Consultant, Software Architecture &amp; AI">
  <title>Dr. Tolga Büyüktanır — R&amp;D Team Leader and Consultant, Software Architecture &amp; AI</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="0.55" stop-color="#0B2530"/>
      <stop offset="1" stop-color="#0E7490"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#22D3EE" stroke-opacity="0.06"/>
    </pattern>
    <clipPath id="r"><rect width="1200" height="300" rx="16"/></clipPath>
  </defs>
  <style>
    text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
    .node { animation: pulse 3.2s ease-in-out infinite; }
    .n2 { animation-delay: .8s; } .n3 { animation-delay: 1.6s; } .n4 { animation-delay: 2.4s; }
    @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  </style>
  <g clip-path="url(#r)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>

    <!-- network motif: a small graph of nodes on the right -->
    <g stroke="#22D3EE" stroke-opacity="0.35" stroke-width="1.5" fill="none">
      <path d="M900 90 L1010 140 L1120 80 M1010 140 L980 230 L1100 210 L1120 80 M900 90 L980 230"/>
    </g>
    <g fill="#67E8F9">
      <circle class="node" cx="900" cy="90" r="6"/>
      <circle class="node n2" cx="1010" cy="140" r="8"/>
      <circle class="node n3" cx="1120" cy="80" r="6"/>
      <circle class="node n4" cx="980" cy="230" r="6"/>
      <circle class="node n2" cx="1100" cy="210" r="5"/>
    </g>
    <circle cx="1010" cy="140" r="18" fill="none" stroke="#F97316" stroke-opacity="0.7" stroke-width="2"/>

    <text x="64" y="92" class="mono" font-size="16" fill="#67E8F9" letter-spacing="2">R&amp;D TEAM LEADER &amp; CONSULTANT · PhD, COMPUTER ENGINEERING</text>
    <text x="64" y="158" font-size="56" font-weight="700" fill="#E6EDF3">Dr. Tolga Büyüktanır</text>
    <text x="64" y="206" font-size="24" fill="#C9D1D9">From idea to production: software architecture &amp; AI,</text>
    <text x="64" y="238" font-size="24" fill="#C9D1D9">built simple and solid.</text>
  </g>
</svg>
